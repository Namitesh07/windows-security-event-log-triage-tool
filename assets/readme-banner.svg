<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Fieldnotes — Windows event log triage</title>
  <desc id="description">Evidence, with context. A fictional example shows five failed logons and one successful logon grouped into a sequence for review.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#100c19"/><stop offset="1" stop-color="#08070e"/></linearGradient>
    <radialGradient id="violet"><stop stop-color="#704497" stop-opacity=".36"/><stop offset="1" stop-color="#704497" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#39649d" stop-opacity=".23"/><stop offset="1" stop-color="#39649d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#background)" stroke="#463451"/>
  <ellipse cx="165" cy="95" rx="360" ry="230" fill="url(#violet)"/>
  <ellipse cx="1070" cy="290" rx="330" ry="250" fill="url(#blue)"/>
  <path d="M675 1v338M1 278h1198" stroke="#3d304c" stroke-opacity=".45"/>
  <g font-family="Segoe UI,Arial,sans-serif">
