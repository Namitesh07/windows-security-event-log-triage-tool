      <path d="M54 39h12l10 10v16H54zM66 39v10h10" fill="none" stroke="#d4a5ef" stroke-width="1.8"/>
      <text x="91" y="58">FIELDNOTES / WINDOWS</text>
    </g>
    <text x="52" y="137" fill="#f4eff9" font-size="66" font-weight="700" letter-spacing="-2">Evidence,</text>
    <text x="52" y="207" fill="#edb7d5" font-size="66" font-weight="700" letter-spacing="-2">with context.</text>
    <text x="56" y="249" fill="#b7adc5" font-size="21">Windows event log triage, in your browser.</text>
    <text x="56" y="313" fill="#b7adc5" font-family="Consolas,monospace" font-size="13" letter-spacing="1.4">LOCAL ANALYSIS · VISIBLE RULES · TRACEABLE EVIDENCE</text>
    <text x="726" y="57" fill="#b7adc5" font-family="Consolas,monospace" font-size="13" letter-spacing="2">FOLLOW THE RECORDS</text>
    <rect x="724" y="79" width="422" height="176" rx="16" fill="#171120" stroke="#5a416e"/>
    <path d="M746 140h378M746 197h378" stroke="#3d304c"/>
    <circle cx="755" cy="111" r="4" fill="#d4a5ef"/>
    <text x="776" y="118" fill="#d4a5ef" font-family="Consolas,monospace" font-size="22">4625</text>
    <text x="858" y="117" fill="#f4eff9" font-size="18">5 failed logons</text>
    <circle cx="755" cy="169" r="4" fill="#a9bdfa"/>
    <text x="776" y="176" fill="#a9bdfa" font-family="Consolas,monospace" font-size="22">4624</text>
    <text x="858" y="175" fill="#f4eff9" font-size="18">1 successful logon</text>
    <text x="747" y="232" fill="#edb7d5" font-size="18" font-weight="600">One sequence to investigate</text>
    <path d="M1091 225h27m-7-7 7 7-7 7" fill="none" stroke="#edb7d5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="725" y="313" fill="#93859f" font-family="Consolas,monospace" font-size="12" letter-spacing="2">FICTIONAL EXAMPLE · REVIEW WITH CONTEXT</text>
